[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sivraj-neural"
version = "0.1.0"
description = "A lightweight neural network for command interpretation and basic conversation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
"torch>=2.6.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0",
"ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"UP",
"B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
